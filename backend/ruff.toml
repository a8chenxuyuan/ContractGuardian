# 合同卫士 Python 编码规范检查配置（对应 .trae/skills/p3c-python/SKILL.md）
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B006"]
# E731 赋值 lambda、E741 模糊变量名：按 skill 第 1 节禁止，保留报错
ignore = []

[lint.per-file-ignores]
# FastAPI Depends() 在默认参数中是框架惯例
"app/routers/*.py" = ["B008"]
# 脚本允许 print 输出；sys.path 引导后 import 的 E402 是脚本模式惯例；
# seed 类脚本含法条原文数据行，E501 豁免
"scripts/*.py" = ["T201", "E402", "E501"]
# app 根的预置范本数据（main.py lifespan 启动播种），合同范本原文数据行
"app/seed_templates.py" = ["E501"]
# E501 豁免原则：内容性长行（中文 prompt / JSON 示例 / HTML 模板 / 关键词数据 /
# 用户文案）不拆行——拆行破坏可复制可测试性；逻辑表达式长行不豁免
# 注意：分层重构后，框架层在 app/agentkit/、检索底座在 app/rag/、
# 规则检测在 app/contracts/rules/、审查业务层在 app/review/
"app/review/agents/*.py" = ["E501"]
"app/review/prompts/*.py" = ["E501"]
"app/review/pipeline.py" = ["E501"]
"app/agentkit/session_graph.py" = ["E501", "E402"]
"app/contracts/rules/red_flag_detector.py" = ["E501"]
"app/routers/review.py" = ["E501"]
"app/review/report.py" = ["E501"]
